name: Deploy to VPS

on:
  workflow_dispatch: # Enables manual trigger button & API access
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Yarn
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Create .env File from Secrets
        run: |
          echo "NEXT_PUBLIC_CORS_URL=${{ secrets.NEXT_PUBLIC_CORS_URL }}" >> .env.local
          echo "NEXT_PUBLIC_CORS_V2_URL=${{ secrets.NEXT_PUBLIC_CORS_V2_URL }}" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env.local
          echo "NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" >> .env.local
          echo "NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}" >> .env.local
          echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_IMAGE_URL=${{ secrets.NEXT_PUBLIC_APP_IMAGE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_MAINTENANCE_MODE=${{ secrets.NEXT_PUBLIC_MAINTENANCE_MODE }}" >> .env.local

      - name: Build Project
        run: yarn build

      - name: Archive Build Files
        run: |
          mkdir -p build && mv .next build/ && mv public build/ && mv package.json build/ && mv yarn.lock build/
          tar -czf build.tar.gz -C build .

      - name: Deploy to VPS
        env:
          SSH_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          # Materialize the deploy key with permissions required by OpenSSH.
          umask 077
          mkdir -p "$HOME/.ssh"
          SSH_KEY_FILE="$HOME/.ssh/vps_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"

          SSH_OPTIONS=(-i "$SSH_KEY_FILE" -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no)
          SCP_OPTIONS=(-i "$SSH_KEY_FILE" -P "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no)

          # Create target directory on VPS
          ssh "${SSH_OPTIONS[@]}" "$SSH_USERNAME@$VPS_HOST" "mkdir -p $APP_DIR"

          # Copy build files to VPS
          scp "${SCP_OPTIONS[@]}" build.tar.gz "$SSH_USERNAME@$VPS_HOST:$APP_DIR/"

          # SSH into VPS and deploy
          ssh "${SSH_OPTIONS[@]}" "$SSH_USERNAME@$VPS_HOST" << EOF
            source ~/.nvm/nvm.sh

            nvm use --lts

            # Navigate to app directory
            cd $APP_DIR

            # Extract build files
            tar -xzf build.tar.gz
            rm -rf build.tar.gz

            # Install dependencies
            yarn install

            # Restart app (use pm2 or a similar process manager)
            pm2 delete truyendex || true
            pm2 start "yarn start -p $PORT" --name truyendex
            pm2 save
          EOF
